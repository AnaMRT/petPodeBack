spring.config.import=optional:dotenv:.env.test

spring.application.name=pet_pode_back


spring.datasource.url=${DATAS_TEST_URL}
spring.datasource.username=${DATAS_TEST_USER}
spring.datasource.password=${DATAS_TEST_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true

jwt.secret=${JWT_TEST_SECRET}
jwt.expiration-ms=3600000


cloudinary.cloud_name=${APIN_TEST_CLOUDINARY}
cloudinary.api_key=${APIK_TEST_CLOUDINARY}
cloudinary.api_secret=${APIS_TEST_CLOUDINARY}

sendgrid.api.key=${APIK_TEST_SENDGRID}
sendgrid.api.url=${SENDG_TEST_URL}
sendgrid.from.email=test@test.com


spring.mail.host=disabled
spring.mail.port=0
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

logging.level.root=ERROR

server.port=0

logging.level.org.springframework.jdbc=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE